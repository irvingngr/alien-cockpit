name: Build AlienCockpit (Windows 11 x64)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AlienCockpit\packages.config -PackagesDirectory packages

      - name: Build AlienCockpit (Release x64)
        run: >
          msbuild AlienCockpit.sln
          /t:AlienCockpit
          /p:Configuration=Release
          /p:Platform=x64
          /m

      - name: Package AlienCockpit artifact
        run: |
          mkdir dist
          xcopy /E /I /Y x64\Release\AlienCockpit.exe dist\
          xcopy /E /I /Y AlienCockpit\ui dist\ui\
          xcopy /E /I /Y AlienCockpit\Mappings dist\Mappings\

      - name: Create Release Zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Compress-Archive -Path dist\* -DestinationPath "AlienCockpit-$tag-win11-x64.zip" -Force

      - name: Upload AlienCockpit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlienCockpit-win11-x64
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "AlienCockpit ${{ github.ref_name }}"
          files: "AlienCockpit-${{ github.ref_name }}-win11-x64.zip"
          generate_release_notes: true
